  <script>
    // This tiny theme controller is independent from the CRM and Supabase SDK.
    // Even if login code or the CDN fails, the theme button still responds.
    (() => {
      const key = 'estateflow_theme';
      let choice = 'light';
      try { choice = localStorage.getItem(key) === 'dark' ? 'dark' : 'light'; }
      catch (_) {}
      document.documentElement.dataset.theme = choice;

      function syncThemeButtons() {
        const isDark = document.documentElement.dataset.theme === 'dark';
        document.querySelectorAll('[data-action="toggle-theme"]').forEach(button => {
          const icon = button.querySelector('.theme-icon');
          if (icon) icon.textContent = isDark ? '☀️' : '🌙';
          const label = isDark ? 'تفعيل الوضع الفاتح' : 'تفعيل الوضع الداكن';
          button.title = label;
          button.setAttribute('aria-label', label);
          button.setAttribute('aria-pressed', String(isDark));
        });
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = isDark ? '#0c1422' : '#0b1222';
      }

      function toggleTheme() {
        const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem(key, next); } catch (_) {}
        syncThemeButtons();
      }

      // Capture listener is attached before the main CRM script loads.
      // stopImmediatePropagation prevents duplicate theme switching.
      document.addEventListener('click', e => {
        const button = e.target.closest?.('[data-action="toggle-theme"]');
        if (!button) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        toggleTheme();
      }, true);
      document.addEventListener('DOMContentLoaded', syncThemeButtons);
    })();
  </script>

<script>
'use strict';
const $ = id => document.getElementById(id);
const E = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = value => { try { const u = new URL(value); return ['https:','http:'].includes(u.protocol) ? E(u.href) : ''; } catch { return ''; } };
const digits = x => String(x||'').replace(/\D/g,'');
const phoneKey = p => { let s=digits(p); if(s.startsWith('0020')) s='20'+s.slice(4); else if(s.startsWith('0')&&s.length===11) s='20'+s.slice(1); return s; };
const phoneHref = p => 'tel:+'+digits(phoneKey(p));

const money = n => n==null||n==='' ? '—' : new Intl.NumberFormat('ar-EG',{maximumFractionDigits:0}).format(Number(n))+' ج.م';
const fmtDate = d => d ? new Date(d).toLocaleString('ar-EG',{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : '—';
const fmtDay = d => d ? new Date(d).toLocaleDateString('ar-EG',{year:'numeric',month:'short',day:'numeric'}) : '—';
const todayStart = () => {const d=new Date();d.setHours(0,0,0,0);return d;};
const inputDate = d => {if(!d)return '';const x=new Date(d); if(isNaN(x))return '';const p=n=>String(n).padStart(2,'0');return `${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())}T${p(x.getHours())}:${p(x.getMinutes())}`;};

const statuses = [['new','جديد'],['attempted','محاولة اتصال'],['contacted','تم التواصل'],['qualified','مؤهل'],['viewing','معاينة'],['negotiation','تفاوض'],['won','مكسب'],['lost','خسارة'],['not_interested','غير مهتم']];

const outcomes = [['answered','رد'],['no_answer','لم يرد'],['busy','مشغول'],['wrong_number','رقم خطأ'],['interested','مهتم'],['not_interested','غير مهتم'],['callback','إعادة اتصال'],['scheduled','تم تحديد موعد'],['other','أخرى']];

const labelOf = (arr,key) => arr.find(x=>x[0]===key)?.[1] || key || '—';
const badge = (text,color='gray') => `<span class="pill ${color}">${E(text)}</span>`;
const stageBadge = s => badge(labelOf(statuses,s),({new:'purple',qualified:'green',won:'green',lost:'red',not_interested:'red',negotiation:'amber',viewing:'amber'})[s]||'gray');
const tempBadge = s => badge(labelOf(temps,s),({hot:'red',warm:'amber',cold:'gray'})[s]);
const profileName = id => data.profiles.find(x=>x.id===id)?.full_name || '—';
const leadName = id => data.leads.find(x=>x.id===id)?.name || '—';

let client=null,user=null,profile=null,page='dashboard',activeLead=null,refreshing=false;
let config={},notifySeen=new Set(),filters={leads:{},properties:{}},selectedLeads=new Set(),detailTab='history';

function toast(message,error=false){let n=document.createElement('div');n.className='toast'+(error?' error':'');n.textContent=message;$('toastbox').append(n);setTimeout(()=>n.remove(),4300);}
function connection() {
  // Always use the published configuration, never browser-saved connection details.
  const c = window.ESTATEFLOW_CONFIG || {};
  return {
    url: String(c.url || '').trim().replace(/\/$/, ''),
    key: String(c.publishableKey || '').trim()
  };
}
function showConnectionIssue(message) {
  $('connectionHint').innerHTML = '<div class="login-error">' + E(message) + '</div>';
}
function initClient() {
  config = connection();
  const validUrl = /^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(config.url)
    && !/YOUR_|PASTE_|EXAMPLE|REPLACE/i.test(config.url);
  const validKey = /^(sb_publishable_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9_.-]+)$/.test(config.key)
    && !/(YOUR_|PASTE_|EXAMPLE|REPLACE)/i.test(config.key);
  if (!validUrl || !validKey) {
    showConnectionIssue('إعدادات Supabase غير مكتملة في ملف index.html. غيّر YOUR_PROJECT_ID وYOUR_KEY إلى القيم الحقيقية من مشروعك على Supabase، ثم احفظ التعديل على GitHub.');
    return false;
  }
  if (!window.supabase?.createClient) {
    showConnectionIssue('تعذّر تحميل مكتبة Supabase. تحقّق من اتصال الإنترنت، وحاول تعطيل مانع الإعلانات أو فتح الموقع بمتصفح آخر.');
    return false;
  }
  try {
    client = window.supabase.createClient(config.url, config.key, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    $('connectionHint').innerHTML = '';
    return true;
  } catch (e) {
    showConnectionIssue('تعذّر إنشاء الاتصال: ' + friendly(e));
    return false;
  }
}
async function ensureSupabaseSDK() {
  if (window.supabase?.createClient) return true;
  // Fallback in case jsDelivr is unavailable on a device/network.
  try {
    await new Promise((resolve, reject) => {
      const script = document.createElement('script');
      const timeout = setTimeout(() => {
        script.remove();
        reject(new Error('CDN timeout'));
      }, 10000);
      script.src = 'https://unpkg.com/@supabase/supabase-js@2';
      script.onload = () => { clearTimeout(timeout); resolve(); };
      script.onerror = () => { clearTimeout(timeout); reject(new Error('CDN error')); };
      document.head.appendChild(script);
    });
  } catch (_) {}
  return !!window.supabase?.createClient;
}
async function bootstrap(){
  config = connection();
  // Validate configuration before requesting any external scripts.
  const validUrl = /^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(config.url)
    && !/YOUR_|PASTE_|EXAMPLE|REPLACE/i.test(config.url);
  const validKey = /^(sb_publishable_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9_.-]+)$/.test(config.key)
    && !/(YOUR_|PASTE_|EXAMPLE|REPLACE)/i.test(config.key);
  if (!validUrl || !validKey) { initClient(); return; }
  await ensureSupabaseSDK();
  if (!initClient()) return;
  try {
    const {data:{session},error} = await client.auth.getSession();
    if (error) throw error;
    if (session?.user) await enter(session.user);
    else showLogin();
  } catch (e) {
    showLogin();
    $('loginMessage').innerHTML = '<div class="login-error">' + E(friendly(e)) + '</div>';
  }
}
function showLogin(){stopNotificationRealtime();user=null;profile=null;notificationInbox=[];notificationSent=[];notificationError='';$('authScreen').classList.remove('hidden');$('appShell').classList.add('hidden');}
async function enter(u){user=u;const {data:p,error}=await client.from('crm_profiles').select('*').eq('id',u.id).maybeSingle();if(error)throw error;
if(!p?.active){await client.auth.signOut();showLogin();$('loginMessage').innerHTML='<div class="login-error">تم التحقق من بيانات الدخول، لكن حسابك غير مفعّل في CRM. راجع جدول crm_profiles أو اطلب من الأدمن تفعيل الحساب.</div>';return;}
profile=p;$('authScreen').classList.add('hidden');$('appShell').classList.remove('hidden');$('sideName').textContent=profile.full_name;$('sideAvatar').textContent=profile.full_name.charAt(0);$('sideRole').textContent=roleLabels[profile.role]||'موظف';$('topHello').textContent='أهلًا، '+profile.full_name;$('topDate').textContent=new Date().toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
document.querySelectorAll('[data-manager]').forEach(x=>x.classList.toggle('hidden',!isManager()));await reload();startNotificationRealtime();}
async function fetchRows(table,order='created_at',max=10000){let result=[],from=0,size=500;while(from<max){let q=client.from(table).select('*').order(order,{ascending:false}).range(from,Math.min(from+size-1,max-1));const {data:rows,error}=await q;if(error)throw error;result.push(...rows);if(rows.length<size)break;from+=size;}return result;}
async function reload(){if(refreshing)return;refreshing=true;try{$('pageContent').innerHTML='<div class="loading">جاري مزامنة البيانات مع Supabase...</div>';
const [profiles,leads,activities,tasks,properties,deals,audit]=await Promise.all([
fetchRows('crm_profiles','created_at',1000),fetchRows('crm_leads','created_at'),fetchRows('crm_activities','occurred_at'),fetchRows('crm_tasks','due_at'),fetchRows('crm_properties','created_at'),fetchRows('crm_deals','created_at'),isManager()?fetchRows('crm_audit','created_at',500):Promise.resolve([])
]);data={profiles,leads,activities,tasks,properties,deals,audit};render();updateAlerts();await loadNotificationData(true);}catch(e){$('pageContent').innerHTML=`<div class="panel"><h3>تعذر تحميل البيانات</h3><p>${E(friendly(e))}</p><button class="btn primary" data-action="refresh">إعادة المحاولة</button></div>`;toast(friendly(e),true);}finally{refreshing=false;}}
function friendly(e){if(!e)return 'حدث خطأ غير متوقع';const code=e.code||'';if(code==='23505')return 'الرقم أو كود العقار مسجّل بالفعل؛ لا يمكن إضافته مرتين.';if(code==='42501')return 'ليس لديك صلاحية لتنفيذ هذه العملية (RLS).';if(code==='23514')return 'هناك قيمة غير صحيحة في البيانات المدخلة.';if(code==='23503')return 'العنصر مرتبط ببيانات أخرى أو الموظف غير موجود.';return e.message||String(e);}
async function write(table,payload,id){const q=id?client.from(table).update(payload).eq('id',id):client.from(table).insert(payload);const {data:result,error}=await q.select('id').single();if(error)throw error;return result;}
function nav(p){if(!isManager()&&['team','audit'].includes(p))return;page=p;selectedLeads.clear();$('sidebar').classList.remove('open');render();window.scrollTo({top:0,behavior:'instant'});}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const screens={dashboard:renderDashboard,leads:renderLeads,calls:renderCalls,tasks:renderTasks,properties:renderProperties,deals:renderDeals,reports:renderReports,team:renderTeam,audit:renderAudit,notifications:renderNotifications,settings:renderSettings};$('pageContent').innerHTML=(screens[page]||renderDashboard)();}
function header(title,subtitle,buttons=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${subtitle}</p></div><div class="btnrow">${buttons}</div></div>`;}
function stat(label,value,detail,icon){return `<div class="stat"><span class="badge-icon">${icon}</span><div class="label">${label}</div><div class="value">${value}</div><div class="detail">${detail}</div></div>`;}
function renderDashboard(){const leads=data.leads.filter(x=>!x.archived_at),open=data.tasks.filter(t=>t.status==='open'),overdue=open.filter(x=>new Date(x.due_at)<new Date()),todayCalls=data.activities.filter(a=>a.type==='call'&&new Date(a.occurred_at)>=todayStart());let pending=open.slice().sort((a,b)=>new Date(a.due_at)-new Date(b.due_at));const totalDeals=data.deals.filter(d=>d.stage==='closed').reduce((s,d)=>s+Number(d.amount||0),0);
let rows=statuses.map(([id,name])=>[name,leads.filter(l=>l.status===id).length]);const max=Math.max(1,...rows.map(r=>r[1]));
return header('لوحة التحكم','نظرة لحظية على حركة المبيعات والكولز',`<button class="btn primary" data-action="new-lead">＋ عميل جديد</button>`)+
`<div class="stats">${stat('إجمالي العملاء',leads.length,'العملاء النشطون','👥')}${stat('مكالمات اليوم',todayCalls.length,'صادر ووارد','☎')}${stat('متابعات متأخرة',overdue.length,'تحتاج إجراء سريعًا','⏰')}${stat('قيمة الصفقات المغلقة',money(totalDeals),'إجمالي المبالغ المسجّلة','💰')}</div>
<div class="cols-2"><div class="panel"><div class="panel-head"><h3 class="section-title">مراحل العملاء</h3><button class="btn small" data-page="leads">عرض الكل</button></div>${rows.map(r=>`<div class="barline"><span class="barlabel">${E(r[0])}</span><div class="barbg"><div class="barfill" style="width:${r[1]/max*100}%"></div></div><b>${r[1]}</b></div>`).join('')}</div><div class="panel"><div class="panel-head"><h3 class="section-title">أقرب المتابعات</h3><button class="btn small" data-page="tasks">كل المتابعات</button></div><div class="item-list">${pending.slice(0,6).map(taskMini).join('')||'<div class="empty">لا توجد متابعات مفتوحة</div>'}</div></div></div>
<div class="panel"><div class="panel-head"><h3 class="section-title">أحدث المكالمات والأنشطة</h3><button class="btn small" data-page="calls">سجل المكالمات</button></div>${renderActivitiesTable(data.activities.slice(0,8))}</div>`;}
function taskMini(t){const dt=new Date(t.due_at),cls=dt<new Date()?'overdue':dt.toDateString()===new Date().toDateString()?'today':'';return `<div class="listitem ${cls}"><div><strong>${E(t.title)}</strong><p><a class="name" data-action="view-lead" data-id="${t.lead_id}">${E(leadName(t.lead_id))}</a> · ${fmtDate(t.due_at)} · ${E(profileName(t.assigned_to))}</p></div><button class="btn small soft" data-action="complete-task" data-id="${t.id}">تم ✓</button></div>`;}
function renderActivitiesTable(rows){return `<div class="table-wrap"><table class="table"><thead><tr><th>التاريخ</th><th>العميل</th><th>النوع</th><th>النتيجة</th><th>الموظف</th><th>المدة</th><th>ملاحظة</th></tr></thead><tbody>${rows.map(a=>`<tr><td>${fmtDate(a.occurred_at)}</td><td><a class="name" data-action="view-lead" data-id="${a.lead_id}">${E(leadName(a.lead_id))}</a></td><td>${badge(labelOf(activityTypes,a.type))}</td><td>${E(labelOf(outcomes,a.outcome))}</td><td>${E(profileName(a.agent_id))}</td><td>${a.duration_seconds?Math.round(a.duration_seconds/60)+' د':'—'}</td><td title="${E(a.notes)}">${E((a.notes||'').slice(0,60))}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">لم تُسجل أنشطة بعد</td></tr>'}</tbody></table></div>`;}
function filterLeadRows(){let f=filters.leads||{};return data.leads.filter(l=>{
 if(l.archived_at&&!f.archived)return false;if(!l.archived_at&&f.archived==='only')return false;
 const q=(f.q||'').toLowerCase().trim();if(q&&!`${l.name} ${l.phone} ${l.phone_key} ${l.alt_phone||''} ${l.district||''} ${(l.tags||[]).join(' ')}`.toLowerCase().includes(q))return false;
 if(f.status&&l.status!==f.status)return false;if(f.temp&&l.temperature!==f.temp)return false;if(f.agent&&l.assigned_to!==f.agent)return false;if(f.source&&l.source!==f.source)return false;if(f.city&&!(l.city||'').toLowerCase().includes(f.city.toLowerCase()))return false;return true;
});}
function leadTableRows(){const arr=filterLeadRows();const sort=(filters.leads?.sort||'latest');arr.sort((a,b)=>sort==='followup'?(new Date(a.next_followup||'2999')-new Date(b.next_followup||'2999')):new Date(b.created_at)-new Date(a.created_at));return arr;}

${isManager()?`<td><input type="checkbox" class="lead-check" value="${l.id}" ${selectedLeads.has(l.id)?'checked':''} /></td>`:''}
<td><a class="name" data-action="view-lead" data-id="${l.id}">${E(l.name)}</a> ${l.archived_at?badge('مؤرشف','gray'):''} ${l.do_not_call?badge('عدم اتصال','red'):''}<div class="muted mini ltr">${E(l.phone)}</div></td>

async function loadNotificationData(silent=false){
 if(!client||!user||notificationFetchRunning)return;
 notificationFetchRunning=true;
 try{
   const inboxQuery=client.from('crm_notifications').select('*').eq('recipient_id',user.id).order('created_at',{ascending:false}).limit(200);
   const sentQuery=isAdmin()?client.from('crm_notifications').select('*').eq('sender_id',user.id).order('created_at',{ascending:false}).limit(100):Promise.resolve({data:[],error:null});
   const [inbox,sent]=await Promise.all([inboxQuery,sentQuery]);
   if(inbox.error)throw inbox.error;
   if(sent.error)throw sent.error;
   notificationInbox=inbox.data||[];
   notificationSent=sent.data||[];
   notificationError='';
 }catch(err){
   notificationError=friendly(err);
   if(!silent)toast('تعذر تحميل إشعارات الإدارة: '+notificationError,true);
 }finally{
   notificationFetchRunning=false;
   updateNotificationBadges();
   if(page==='notifications'&&$('pageContent'))render();
 }
}
function stopNotificationRealtime(){
 if(notificationChannel&&client){try{client.removeChannel(notificationChannel);}catch(_){}}
 notificationChannel=null;
}
function startNotificationRealtime(){
 stopNotificationRealtime();
 if(!client||!user)return;
 const targetUser=user.id;
 try{
  notificationChannel=client.channel('estateflow-notifications-'+targetUser)
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'crm_notifications',filter:'recipient_id=eq.'+targetUser},payload=>{
    if(user?.id!==targetUser)return;
    const n=payload.new;
    if(n?.title)toast('📨 إشعار جديد: '+n.title);
    loadNotificationData(true);
   })
   .on('postgres_changes',{event:'UPDATE',schema:'public',table:'crm_notifications',filter:'recipient_id=eq.'+targetUser},()=>loadNotificationData(true))
   .subscribe();
 }catch(err){console.warn('Realtime notifications unavailable; polling will continue.',err);}
}
async function sendAdminNotification(form){
 if(!isAdmin())throw Error('إرسال الإشعارات متاح للأدمن فقط.');
 const fd=new FormData(form);
 const target=String(fd.get('recipient_id')||'');
 const title=String(fd.get('title')||'').trim();
 const message=String(fd.get('message')||'').trim();
 const priority=String(fd.get('priority')||'normal');
 if(title.length<2||title.length>100||!message||message.length>2000)throw Error('عنوان أو نص الإشعار غير صالح.');
 if(!['normal','important','urgent'].includes(priority))throw Error('أولوية غير صالحة.');
 const active=data.profiles.filter(p=>p.active&&p.id!==user.id);
 const targets=target==='all'?active:active.filter(p=>p.id===target);
 if(!targets.length)throw Error('لا يوجد مستخدم نشط مطابق للاختيار.');
 const button=form.querySelector('button[type="submit"]');
 if(button){button.disabled=true;button.textContent='جاري الإرسال...';}
 try{
   // RLS in the SQL migration allows INSERT only when the session belongs to an active admin.
   const rows=targets.map(p=>({recipient_id:p.id,sender_id:user.id,title,message,priority}));
   const {error}=await client.from('crm_notifications').insert(rows);
   if(error)throw error;
   toast(`تم إرسال الإشعار إلى ${rows.length} مستخدم ✓`);
   await loadNotificationData(true);
   if(page==='notifications')render();
 }finally{
   if(button&&button.isConnected){button.disabled=false;button.textContent='✉ إرسال الإشعار';}
 }
}

 if(l.budget_max&&p.price&&Number(p.price)>Number(l.budget_max))return false;

 return true;

function csvCell(value){let s=String(value??'');if(/^[\u0000-\u0020]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function downloadCSV(filename,headers,rows){const contents='\uFEFF'+[headers,...rows].map(row=>row.map(csvCell).join(',')).join('\r\n');const blob=new Blob([contents],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);}

function parseCsv(input){let result=[],row=[],value='',quoted=false;input=input.replace(/^\uFEFF/,'');for(let i=0;i<input.length;i++){const c=input[i];if(quoted){if(c==='"'&&input[i+1]==='"'){value+='"';i++;}else if(c==='"')quoted=false;else value+=c;}else if(c==='"')quoted=true;else if(c===','){row.push(value);value='';}else if(c==='\n'){row.push(value.replace(/\r$/,''));result.push(row);row=[];value='';}else value+=c;}if(value||row.length){row.push(value);result.push(row);}return result;}

async function importCSV(form){const file=new FormData(form).get('file');if(!file||!file.name)throw Error('اختر ملف CSV.');const text=await file.text(),rows=parseCsv(text).filter(r=>r.some(c=>c.trim()));if(rows.length<2)throw Error('الملف فارغ.');const headers=rows.shift().map(x=>x.trim().toLowerCase());const names={name:['name','الاسم','اسم العميل'],phone:['phone','mobile','الهاتف','رقم الهاتف'],source:['source','المصدر'],city:['city','المدينة'],district:['district','المنطقة'],property_type:['property_type','نوع العقار'],purpose:['purpose','الغرض'],budget_max:['budget_max','الميزانية'],temperature:['temperature','التصنيف'],notes:['notes','ملاحظات']};let indexes={};for(const [k,aliases] of Object.entries(names))indexes[k]=headers.findIndex(h=>aliases.includes(h));if(indexes.name<0||indexes.phone<0)throw Error('اسم العمودين name و phone مطلوبان.');if(rows.length>200)throw Error('الحد الأقصى 200 صف في الملف الواحد.');let created=0,skipped=0,failed=0;const seen=new Set(data.leads.map(l=>l.phone_key));for(const row of rows){const get=k=>indexes[k]<0?'':String(row[indexes[k]]||'').trim();const key=phoneKey(get('phone'));if(!get('name')||key.length<9||seen.has(key)){skipped++;continue;}seen.add(key);const p={name:get('name'),phone:get('phone'),source:get('source')||'CSV Import',city:get('city')||null,district:get('district')||null,property_type:get('property_type')||null,purpose:['buy','rent','sell'].includes(get('purpose'))?get('purpose'):'buy',budget_max:Number(get('budget_max'))||null,temperature:['hot','warm','cold'].includes(get('temperature'))?get('temperature'):'warm',notes:get('notes')||null,created_by:user.id,assigned_to:user.id};const {error}=await client.from('crm_leads').insert(p);if(error){if(error.code==='23505')skipped++;else failed++;}else created++;}
closeModal();toast(`الاستيراد: ${created} جديد، ${skipped} متجاوز، ${failed} فشل${failed?' (راجع التنسيق والصلاحيات)':''}`,failed>0);await reload();}

case 'lead-tab':{detailTab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===detailTab));const l=data.leads.find(x=>x.id===activeLead);if(l&&$('leadDetailTab'))$('leadDetailTab').innerHTML=leadDetailBody(l);break;}
case 'bulk-assign':await bulkAssign();break;case 'show-alerts':showAlerts();break;case 'import-csv':showImport();break;
case 'export-leads':exportData('leads');break;case 'export-calls':exportData('calls');break;case 'export-tasks':exportData('tasks');break;case 'export-deals':exportData('deals');break;case 'export-report':exportData('report');break;
case 'download-template':downloadCSV('estateflow_import_template.csv',['name','phone','source','city','district','property_type','purpose','budget_max','temperature','notes'],[['عميل مثال','01012345678','Facebook','القاهرة','التجمع الخامس','شقة','buy',3000000,'hot','مهتم بمعاينة']]);break;
case 'invite-help':modal('إضافة حساب موظف',`<div class="hint">لأن استدعاء <b>Auth Admin API</b> يتطلب مفتاحًا سريًا، فلا يمكن إنشاء الحسابات بأمان مباشرة من GitHub Pages. افتح Supabase Dashboard → Authentication → Users → Add user → Send invitation. بعد قبول الدعوة يظهر الموظف هنا، ويمكن للأدمن تعديل صلاحياته.</div><a class="btn primary" href="https://supabase.com/dashboard" target="_blank" rel="noopener noreferrer">فتح لوحة Supabase</a>`);break;
case 'print':window.print();break;
}}catch(err){toast(friendly(err),true);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modalRoot').innerHTML)closeModal();});
document.addEventListener('click',e=>{if(e.target.classList?.contains('modal-overlay'))closeModal();});
setInterval(tickNotifications,60000);
setInterval(()=>{if(user&&client&&!document.hidden)loadNotificationData(true);},45000);
bootstrap();
</script>
